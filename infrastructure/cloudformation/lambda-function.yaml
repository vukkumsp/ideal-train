
AWSTemplateFormatVersion: '2010-09-09'
Description: Java 21 Hello Lambda Function

Resources:

  HelloLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hello-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  HelloLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: hello-java21-function
      Runtime: java21
      Handler: com.idealtrain.lambda.HelloHandler
      Role: !GetAtt HelloLambdaExecutionRole.Arn
      Code:
        S3Bucket: ideal-train-lambda-artifacts
        S3Key: hello-lambda/hello-lambda-1.0.0.jar
      Timeout: 15
      MemorySize: 512
